<div class="page-container">
  <div class="page-header">
    <h1>🛵 Fattorini</h1>
    <button class="btn btn-primary" (click)="nuovo()">+ Nuovo Fattorino</button>
  </div>

  <div class="filtri-card">
    <select class="input-field" [(ngModel)]="filtroDisponibile" (change)="carica()">
      <option value="">Tutti</option>
      <option value="1">Disponibili</option>
      <option value="0">Non disponibili</option>
    </select>
  </div>

  <div *ngIf="errore" class="alert alert-error">{{ errore }}</div>
  <div *ngIf="loading" class="loading-spinner">Caricamento...</div>

  <div class="grid-cards" *ngIf="!loading">
    <div class="card" *ngFor="let f of fattorini">
      <div class="card-body">
        <h3>{{ f.nome }}</h3>
        <p class="text-muted">🚗 {{ f.mezzo }}</p>
        <span class="badge" [ngClass]="f.disponibile ? 'badge-green' : 'badge-red'">
          {{ f.disponibile ? 'Disponibile' : 'Occupato' }}
        </span>
      </div>
      <div class="card-actions">
        <button class="btn btn-sm btn-outline" (click)="modifica(f.id_fattorino, $event)">Modifica</button>
        <button class="btn btn-sm btn-danger" (click)="elimina(f.id_fattorino, $event)">Elimina</button>
      </div>
    </div>
    <div class="empty-state" *ngIf="fattorini.length === 0"><p>Nessun fattorino trovato.</p></div>
  </div>
</div>
